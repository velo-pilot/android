AutoName: OsmAnd Speed Pedelec
Summary: OsmAnd with routing for 45 km/h speed pedelecs
Description: |-
    OsmAnd with a built-in speed pedelec profile. It routes like a moped of class P: up to 45 km/h,
    off the cycle paths and roads that speed pedelecs may not use. Belgian rules are the default; the
    profile can switch to the generic moped rules of the Netherlands, Germany and France.

    The app installs next to OsmAnd and can use the maps of an installed OsmAnd app instead of
    downloading them again: set OsmAnd's data storage folder to "Multiuser storage" and allow
    "Install unknown apps" under Settings > OsmAnd settings > Maps from OsmAnd. Android only grants
    access to another app's obb folder with that permission; the app never installs anything.

    Built from the speed-pedelec branch of OsmAnd.
