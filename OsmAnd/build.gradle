apply plugin: 'com.android.application'
apply from: 'build-common.gradle'
apply from: rootProject.file("versions.gradle")

apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Global Parameters accepted
// TARGET_APP_NAME    - app name
// APK_NUMBER_VERSION - version number of apk
// APK_VERSION_SUFFIX - build number like #99999Z, appended (for dev builds) to Manifest's versionName as X.X.X#99999Z
//                      Z means flavor: M=-master, D=-main-default, Des=-design, MQA=-main-qt-arm, MQDA=-main-qt-default-arm, S=-sherpafy
// APP_EDITION        - date stamp of builds
// OSMAND_APK_KEYSTORE, OSMAND_APK_KEY_ALIAS, OSMAND_APK_PASSWORD - release signing key

// 1. To be done Filter fonts
// <unzip src="OsmAndCore_android.aar" dest=".">
//            <patternset>
//                <include name="assets/**/map/fonts/OpenSans/*"/>
//                <include name="assets/**/map/fonts/NotoSans/*"/>
//            </patternset>
//        </unzip>
// Less important

android {
	signingConfigs {
		development {
			storeFile file("../keystores/debug.keystore")
			storePassword "android"
			keyAlias "androiddebugkey"
			keyPassword "android"
		}

		publishing {
			// OSMAND_APK_KEYSTORE and OSMAND_APK_KEY_ALIAS select another release key, see build-container/release.sh
			storeFile file(System.getenv("OSMAND_APK_KEYSTORE") ?: "/var/lib/jenkins/osmand_key")
			storePassword System.getenv("OSMAND_APK_PASSWORD")
			keyAlias System.getenv("OSMAND_APK_KEY_ALIAS") ?: "osmand"
			keyPassword System.getenv("OSMAND_APK_PASSWORD")
		}
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
		coreLibraryDesugaringEnabled true
	}

	kotlinOptions {
		jvmTarget = "17"
	}

	defaultConfig {
		minSdkVersion osmand_minSdk
		versionCode 5550
		versionCode System.getenv("APK_NUMBER_VERSION") ? System.getenv("APK_NUMBER_VERSION").toInteger() : versionCode
		versionName "5.5.0"
		versionName System.getenv("APK_VERSION")? System.getenv("APK_VERSION").toString(): versionName
		versionName System.getenv("APK_VERSION_SUFFIX")? versionName + System.getenv("APK_VERSION_SUFFIX").toString(): versionName
		// Read maps from the obb folder of another OsmAnd app, see SharedMapsHelper
		buildConfigField "boolean", "SHARED_OSMAND_MAPS", "false"
		// Sell OsmAnd Pro and offer the OsmAnd services it pays for (OsmAnd Cloud, weather, Live updates). Without
		// it the Pro features that run on the device are free and those services are hidden, see Version
		buildConfigField "boolean", "OSMAND_PURCHASES", "true"
		// Profile the app starts in and the profiles shown on a fresh install
		buildConfigField "String", "DEFAULT_APP_MODE", "\"default\""
		// Map style of profiles without their own default (RendererRegistry key)
		buildConfigField "String", "DEFAULT_RENDERER", "\"OsmAnd\""
		buildConfigField "String", "DEFAULT_AVAILABLE_APP_MODES", "\"car,bicycle,e_bike,pedestrian,speed_pedelec,public_transport,\""
		// Built-in profiles the app leaves out: not listed, cannot be selected or used as a base, see ApplicationMode
		buildConfigField "String", "HIDDEN_APP_MODES", "\"\""
	}

	lintOptions {
		lintConfig file("lint.xml")
		warningsAsErrors false
	}

	bundle {
		language {
			// Specifies that the app bundle should not support
			// configuration APKs for language resources. These
			// resources are instead packaged with each base and
			// dynamic feature APK.
			enableSplit = false
		}
	}

	// related to kuromoji
	//packagingOptions {
	//	exclude '/META-INF/CONTRIBUTORS.md'
	//	exclude '/META-INF/LICENSE.md'
	//	exclude '/META-INF/NOTICE.md'
	//}

	sourceSets {
		debug {
			manifest.srcFile "AndroidManifest-debug.xml"
		}
		gplayFull {
			java.srcDirs = ["src-google"]
		}
		gplayFree {
			java.srcDirs = ["src-google"]
			manifest.srcFile "AndroidManifest-gplayFree.xml"
		}
		androidFull {
			java.srcDirs = ["src-google", "src-osmand"]
			manifest.srcFile "AndroidManifest-androidFull.xml"
		}
		nightlyFree {
			java.srcDirs = ["src-google", "src-osmand"]
			manifest.srcFile "AndroidManifest-nightlyFree.xml"
		}
		velopilot {
			java.srcDirs = ["src-google", "src-osmand"]
			manifest.srcFile "AndroidManifest-velopilot.xml"
			// Branding, see branding/generate.py; generateVelopilotStrings adds the strings that call the app VeloPilot
			res.srcDirs = ["res-velopilot"]
		}
		velopilotDev {
			java.srcDirs = ["src-google", "src-osmand"]
			manifest.srcFile "AndroidManifest-velopilot.xml"
			// The VeloPilot branding, plus the launcher icon of the dev builds
			res.srcDirs = ["res-velopilot", "res-velopilot-dev"]
		}
		velopilotBeta {
			java.srcDirs = ["src-google", "src-osmand"]
			manifest.srcFile "AndroidManifest-velopilot.xml"
			// The VeloPilot branding, plus the launcher icon of the beta builds
			res.srcDirs = ["res-velopilot", "res-velopilot-beta"]
		}
		huawei {
			java.srcDirs = ["src-huawei"]
			manifest.srcFile "AndroidManifest-huawei.xml"
		}

		legacy {
			jniLibs.srcDirs = ["libc++"]
		}
	}

	buildFeatures {
		aidl true
		compose true
	}

	flavorDimensions "version", "coreversion", "abi"
	productFlavors {
		// Version
		nightlyFree {
			dimension "version"
			applicationId "net.osmand.dev"
			resValue "string", "app_name", "OsmAnd Nightly"
			resValue "string", "app_edition", System.getenv("APP_EDITION") ? System.getenv("APP_EDITION") : ""
			// resConfig "en"
		}
		// VeloPilot, the speed pedelec fork: installs next to OsmAnd and can use its maps
		velopilot {
			dimension "version"
			applicationId "be.velopilot.app"
			// VeloPilot's own version: the release tag vX.Y.Z sets it in CI (build-container/ci/version.sh), and the
			// first release takes this versionName
			versionName System.getenv("APK_VERSION") ?: "0.1.0"
			versionCode System.getenv("APK_NUMBER_VERSION") ? System.getenv("APK_NUMBER_VERSION").toInteger() : 100
			resValue "string", "app_name", "VeloPilot"
			resValue "string", "app_edition", System.getenv("APP_EDITION") ? System.getenv("APP_EDITION") : ""
			buildConfigField "boolean", "SHARED_OSMAND_MAPS", "true"
			buildConfigField "boolean", "OSMAND_PURCHASES", "false"
			buildConfigField "String", "DEFAULT_APP_MODE", "\"speed_pedelec\""
			buildConfigField "String", "DEFAULT_RENDERER", "\"VeloPilot travel\""
			buildConfigField "String", "DEFAULT_AVAILABLE_APP_MODES", "\"bicycle,e_bike,speed_pedelec,\""
			// Leave driving, boating, flying and skiing to OsmAnd. Android Auto stays (a phone screen on the
			// handlebars): without a car profile it keeps the current profile, see NavigationSession
			buildConfigField "String", "HIDDEN_APP_MODES", "\"car,truck,boat,aircraft,ski,\""
			manifestPlaceholders = [velopilotIcon: "@mipmap/icon_velopilot"]
		}
		// VeloPilot dev (builds of main) and beta (pre-releases) builds: install next to the release app, with
		// their own launcher icon
		velopilotDev {
			initWith productFlavors.velopilot
			dimension "version"
			applicationId "be.velopilot.dev"
			resValue "string", "app_name", "VeloPilot Dev"
			manifestPlaceholders = [velopilotIcon: "@mipmap/icon_velopilot_dev"]
		}
		velopilotBeta {
			initWith productFlavors.velopilot
			dimension "version"
			applicationId "be.velopilot.beta"
			resValue "string", "app_name", "VeloPilot Beta"
			manifestPlaceholders = [velopilotIcon: "@mipmap/icon_velopilot_beta"]
		}
		androidFull {
			dimension "version"
			applicationId "net.osmand.plus"
			resValue "string", "app_name", "OsmAnd~"
			resValue "string", "app_edition", System.getenv("APP_EDITION") ? System.getenv("APP_EDITION") : ""
		}
		gplayFree {
			dimension "version"
			applicationId "net.osmand"
			resValue "string", "app_name", "OsmAnd"
			resValue "string", "app_edition", System.getenv("APP_EDITION") ? System.getenv("APP_EDITION") : ""
		}
		gplayFull {
			dimension "version"
			applicationId "net.osmand.plus"
			resValue "string", "app_name", "OsmAnd+"
			resValue "string", "app_edition", System.getenv("APP_EDITION") ? System.getenv("APP_EDITION") : ""
		}
		huawei {
			dimension "version"
			applicationId "net.osmand.huawei"
			resValue "string", "app_name", "OsmAnd"
			resValue "string", "app_edition", ""
		}

        // Build that includes 3D OpenGL release
		opengl {
			dimension "coreversion"
		}
        // Build that includes 3D OpenGL debug
		opengldebug {
			dimension "coreversion"
		}
	}

	buildTypes {
		debug {
			signingConfig signingConfigs.development
		}
		release {
			signingConfig signingConfigs.publishing
			minifyEnabled true
			shrinkResources false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}

	applicationVariants.configureEach {
		def variant = it
		def taskName = variant.name.capitalize()
		def mergeAssetsTaskName = "merge${taskName}Assets"
		tasks.named(mergeAssetsTaskName).configure { osmandTask ->
			println(osmandTask.getName() + " merge assets")
			osmandTask.dependsOn(collectExternalResources)
		}
		if (taskName.endsWith("Debug")) {
			def mergeAndroidTestAssetsTaskName = "merge${taskName}AndroidTestAssets"
			tasks.named(mergeAndroidTestAssetsTaskName).configure { osmandTask ->
				println(osmandTask.getName() + " merge test assets")
				osmandTask.dependsOn(collectExternalResources)
			}
		}
		def mapSourceSetPathsName= "map${taskName}SourceSetPaths"
		tasks.named(mapSourceSetPathsName).configure { osmandTask ->
			println(osmandTask.getName())
			osmandTask.dependsOn(copyIcons)
		}
		def mergeResources= "merge${taskName}Resources"
		tasks.named(mergeResources).configure { osmandTask ->
			println(osmandTask.getName() + " merge resources")
			osmandTask.dependsOn(collectExternalResources)
		}
		def generateResources= "generate${taskName}Resources"
		tasks.named(generateResources).configure { osmandTask ->
			println(osmandTask.getName() + " generate resources")
			osmandTask.dependsOn(collectExternalResources)
		}
	}
}

afterEvaluate {
	android.applicationVariants.configureEach { variant ->
		if (variant.name.contains('Opengldebug')) {
			variant.javaCompileProvider.configure {
				dependsOn collectExternalResources, buildOsmAndCore, copyOsmAndCoreWithJNI, cleanupDuplicatesInCore
			}
		} else {
			variant.javaCompileProvider.configure {
				dependsOn collectExternalResources, buildOsmAndCore, cleanupDuplicatesInCore
			}
		}
	}

	Gradle gradle = getGradle()
	String tskReqStr = gradle.getStartParameter().getTaskRequests().toString().toLowerCase()
	if (tskReqStr.contains("huawei")) {
		apply plugin: 'com.huawei.agconnect'
	}
}

tasks.register('copyOsmAndCoreWithJNI') {
	dependsOn buildOsmAndCore
	doLast {
		file("libs/armeabi-v7a").mkdirs()
		copy { from("../../binaries/android/clang-armeabi-v7a/Debug/libOsmAndCoreWithJNI.so") into("libs/armeabi-v7a") }

		file("libs/arm64-v8a").mkdirs()
		copy { from("../../binaries/android/clang-arm64-v8a/Debug/libOsmAndCoreWithJNI.so") into("libs/arm64-v8a") }

		file("libs/x86").mkdirs()
		copy { from("../../binaries/android/clang-x86/Debug/libOsmAndCoreWithJNI.so") into("libs/x86") }

		file("libs/x86_64").mkdirs()
		copy { from("../../binaries/android/clang-x86_64/Debug/libOsmAndCoreWithJNI.so") into("libs/x86_64") }
	}
}

dependencies {
	openglImplementation fileTree(include:  ['QtAndroid.jar', 'QtAndroidBearer.jar', 'QtAndroidNetwork.jar'], dir: 'libs')
	opengldebugImplementation fileTree(include:  ['QtAndroid.jar', 'QtAndroidBearer.jar', 'QtAndroidNetwork.jar'], dir: 'libs')

	//huaweiImplementation 'com.huawei.agconnect:agconnect-core:1.8.0.300'
	huaweiImplementation 'com.huawei.hms:iap:6.4.0.301'
	huaweiImplementation 'com.huawei.hms:appservice:6.8.0.300'

	coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.3")
}

afterEvaluate {
	def remoteAarSnapshot = "master-snapshot"
	def localAarFile = file("../../core/wrappers/android/build/outputs/aar/OsmAndCore_android-debug.aar")

	def requestedTasks = gradle.startParameter.taskNames.join(",").toLowerCase()
	def useLocalOsmAndCore = requestedTasks.contains("opengldebug") && localAarFile.exists()

	if (useLocalOsmAndCore) {
		println "Using local OsmAndCore AAR (${localAarFile})"
		dependencies.add("openglImplementation", files(localAarFile))
		dependencies.add("opengldebugImplementation", files(localAarFile))
	} else {
		println "Using remote OsmAndCore snapshot (${remoteAarSnapshot})"
		dependencies.add("openglImplementation", "net.osmand:OsmAndCore_androidNativeRelease:${remoteAarSnapshot}@aar")
		dependencies.add("openglImplementation", "net.osmand:OsmAndCore_android:${remoteAarSnapshot}@aar")
		dependencies.add("opengldebugImplementation", "net.osmand:OsmAndCore_androidNativeDebug:${remoteAarSnapshot}@aar")
		dependencies.add("opengldebugImplementation", "net.osmand:OsmAndCore_android:${remoteAarSnapshot}@aar")
	}
}

// The OpenGL renderer reads shields and icons only from the resource bundle of OsmAndCore, not from
// res/drawable. Add the app's own ones (core-resources/) to the merged bundle: each file is stored
// qCompress-ed as <path>.qz and listed in OsmAndCore_ResourcesBundle.index.
def extraCoreResources = file("core-resources")
tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { task ->
	if (task.name ==~ /merge\w*Opengl\w*Assets/) {
		task.inputs.dir(extraCoreResources).withPropertyName("extraCoreResources")
		task.doLast {
			def outDir = task.outputDir.get().asFile
			def index = new File(outDir, "OsmAndCore_ResourcesBundle.index")
			if (!index.exists()) {
				throw new GradleException("OsmAndCore resource bundle index not found in ${outDir}")
			}
			def entries = index.readLines() as Set
			def added = []
			extraCoreResources.eachFileRecurse(groovy.io.FileType.FILES) { f ->
				def name = extraCoreResources.toPath().relativize(f.toPath()).toString().replace(File.separator, "/")
				def data = f.bytes
				def target = new File(outDir, "OsmAndCore_ResourcesBundle/${name}.qz")
				target.parentFile.mkdirs()
				target.withOutputStream { out ->
					out.write(java.nio.ByteBuffer.allocate(4).putInt(data.length).array())
					def deflater = new java.util.zip.DeflaterOutputStream(out)
					deflater.write(data)
					deflater.finish()
				}
				if (!entries.contains(name)) {
					added << name
				}
			}
			if (added) {
				def text = index.text
				index.append((text.isEmpty() || text.endsWith("\n") ? "" : "\n") + added.join("\n"))
			}
		}
	}
}

// VeloPilot calls itself VeloPilot: the strings that mention OsmAnd, in all languages, get VeloPilot instead.
// They keep naming OsmAnd where they mean OsmAnd's services (OsmAnd Cloud, Live, Pro, Maps, OsmAnd+), the OsmAnd
// project or the OsmAnd app whose maps VeloPilot can use.
abstract class GenerateVelopilotStrings extends DefaultTask {
	@Internal
	abstract DirectoryProperty getResDir()

	@InputFiles
	@PathSensitive(PathSensitivity.RELATIVE)
	FileTree getStrings() {
		return resDir.get().asFileTree.matching { include "values*/strings.xml" }
	}

	@OutputDirectory
	abstract DirectoryProperty getOutputDir()

	@TaskAction
	void generate() {
		def keepNames = ~/shared_osmand_maps.*|osmand_team|send_uuid_preference_desc|calculate_online_altitude_descr|help_article_.*|free_versions_descr|install_selected_build|loading_builds.*|select_build_to_install/
		def element = ~/(?s)<(string-array|plurals|string)\b[^>]*\bname="([^"]+)"[^>]*>.*?<\/\1>/
		def text = ~/>[^<]*</
		def osmand = ~/(?<![A-Za-z])OsmAnd(?![A-Za-z0-9_+~]| (?:Cloud|Live|Pro|Maps|Plans|Start|Unlimited)\b| ?\(OSM)/
		def root = outputDir.get().asFile
		root.deleteDir()
		resDir.get().asFile.eachDirMatch(~/values.*/) { dir ->
			def src = new File(dir, "strings.xml")
			if (!src.exists()) {
				return
			}
			def xml = src.getText("UTF-8").replaceAll(/(?s)<!--.*?-->/, "")
			def changed = []
			(xml =~ element).each { match ->
				String original = match[0]
				if (!(match[2] ==~ keepNames)) {
					def renamed = original.replaceAll(text) { String segment -> segment.replaceAll(osmand, "VeloPilot") }
					if (renamed != original) {
						changed << "\t" + renamed
					}
				}
			}
			if (changed) {
				def resources = (xml =~ /<resources\b[^>]*>/)[0]
				def target = new File(root, "${dir.name}/strings.xml")
				target.parentFile.mkdirs()
				target.setText("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n${resources}\n${changed.join("\n")}\n</resources>\n", "UTF-8")
			}
		}
	}
}

def generateVelopilotStrings = tasks.register('generateVelopilotStrings', GenerateVelopilotStrings) {
	resDir = layout.projectDirectory.dir("res")
}

androidComponents {
	["velopilot", "velopilotDev", "velopilotBeta"].each { flavor ->
		onVariants(selector().withFlavor(new kotlin.Pair("version", flavor))) { variant ->
			variant.sources.res.addGeneratedSourceDirectory(generateVelopilotStrings, { it.outputDir })
		}
	}
}
