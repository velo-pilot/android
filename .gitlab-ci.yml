# VeloPilot: builds the APK and publishes releases in the F-Droid repository on cdn.osmpedelec.be.
# The runner, the CI/CD variables and the release steps are described under "Releases" in build-container/README.md.
#
# Branch pipelines: apk:debug (manual) builds a debug APK; on the default branch, release:tag (manual) tags the
# commit as the next release vX.Y.Z.
# Tag pipelines (vX.Y.Z): apk:release builds the signed APK, fdroid:publish adds it to the repository.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_BRANCH

stages:
  - release
  - build
  - publish

variables:
  CDN_URL: https://cdn.osmpedelec.be
  # Persistent volume of the docker executor (volumes = ["/cache"] in the runner's config.toml): Android SDK,
  # Gradle and Kotlin/Native caches and OsmAnd-resources
  CACHE_ROOT: /cache/osmpedelec
  GIT_DEPTH: 20

default:
  tags:
    - osmpedelec

.android:
  image: docker.io/library/eclipse-temurin:17-jdk-noble
  variables:
    ANDROID_HOME: $CACHE_ROOT/android-sdk
    GRADLE_USER_HOME: $CACHE_ROOT/gradle
    KONAN_DATA_DIR: $CACHE_ROOT/konan
  before_script:
    - build-container/ci/prepare-android.sh

release:tag:
  stage: release
  image: docker.io/library/buildpack-deps:trixie-scm
  variables:
    # The release notes list the commits since the last release
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - build-container/ci/tag-release.sh

apk:debug:
  extends: .android
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - build-container/ci/build-apk.sh assembleVelopilotOpenglArm64Debug
  artifacts:
    paths:
      - apk/
    expire_in: 1 week

apk:release:
  extends: .android
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - build-container/ci/build-apk.sh assembleVelopilotOpenglArm64Release
  artifacts:
    paths:
      - apk/
    expire_in: 1 month

fdroid:publish:
  stage: publish
  image: docker.io/library/debian:trixie-slim
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - apk:release
  # One upload at a time: each run rewrites the index from what the storage zone holds
  resource_group: fdroid
  environment:
    name: fdroid
    url: $CDN_URL/fdroid/repo/index.html
  variables:
    ANDROID_HOME: /usr/lib/android-sdk
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates fdroidserver git > /dev/null
  script:
    - build-container/fdroid/update-repo.sh apk/*.apk
